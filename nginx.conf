# Conexão persistente só quando o cliente realmente pediu upgrade. Mandar
# `Connection: upgrade` em toda requisição, como estava antes, derruba o
# keep-alive com a API em requisições comuns.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # O padrão do nginx é 1 MB, e ele recusa ANTES de a requisição chegar na
    # API — com uma página de erro em HTML, que a tela não tem como
    # interpretar. Como o maior limite da aplicação é 25 MB (mídia da
    # conversa e do catálogo), aqui fica com folga. Mudou lá? Muda aqui junto.
    client_max_body_size 30m;
    # Não gravar o corpo em disco antes de repassar: para upload de vídeo isso
    # é uma cópia inteira à toa.
    client_body_buffer_size 1m;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://autosales-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fluxo de eventos (SSE): a API manda `X-Accel-Buffering: no` nessas
        # rotas e o nginx respeita, mas o tempo de leitura precisa ser maior
        # que o intervalo entre mensagens — senão a conexão cai e o navegador
        # fica reconectando. O keep-alive da API bate a cada 25s.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Upload grande leva tempo para subir em rede ruim.
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
    }
}
